<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Sentiment Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            font-size: 2em;
            background: -webkit-linear-gradient(#a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-link:hover { color: #f8fafc; }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 25px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #6366f1;
            margin: 5px 0 0 0;
        }

        .chart-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 450px;
            margin: auto;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <a href="index.html" class="nav-link">← Back to Sentiment Analyzer</a>
        <h2>Global Analytics Dashboard</h2>

        <div class="stat-card">
            <div>Total Sentences Analyzed Globally</div>
            <div class="stat-number" id="totalRequests">0</div>
        </div>

        <div class="chart-box">
            <canvas id="globalChart"></canvas>
        </div>
    </div>

    <script>
        async function loadGlobalStats() {
            try {
                const response = await fetch('https://nlp-backend-xsoy.onrender.com/analytics');
                const data = await response.json();

                document.getElementById('totalRequests').innerText = data["Total Requests"] || 0;

                const breakdown = data.Breakdown || {};
                const positive = breakdown.Positive || 0;
                const neutral = breakdown.Neutral || 0;
                const negative = breakdown.Negative || 0;

                const ctx = document.getElementById('globalChart').getContext('2d');
                new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['Positive', 'Neutral', 'Negative'],
                        datasets: [{
                            data: [positive, neutral, negative],
                            backgroundColor: ['#22c55e', '#94a3b8', '#ef4444'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { color: '#94a3b8' } },
                            title: { display: true, text: 'All-Time Global Sentiment Share', color: '#fff' }
                        }
                    }
                });
            } catch (err) {
                console.error("Error fetching analytics:", err);
                document.getElementById('totalRequests').innerText = "Offline";
            }
        }

        window.onload = loadGlobalStats;
    </script>
</body>
</html>
