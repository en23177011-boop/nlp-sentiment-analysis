<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Sentiment Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --danger: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .dashboard { background: var(--card-bg); width: 100%; max-width: 900px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); }
        h2 { text-align: center; margin-top: 0; font-size: 1.8em; color: #e2e8f0; font-weight: 600; }
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        textarea { width: 100%; box-sizing: border-box; height: 120px; padding: 15px; background: rgba(255, 255, 255, 0.03); color: white; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; font-size: 15px; resize: none; outline: none; transition: 0.2s; }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
        button { padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--primary-hover); }
        #results-container { display: none; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .main-sentiment { text-align: center; font-size: 1.5em; margin: 20px 0; padding: 20px; background: rgba(255,255,255,0.02); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .profanity-alert { display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: #fca5a5; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: 500; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .chart-box { background: rgba(0,0,0,0.15); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.03); }
        .full-width-chart { grid-column: span 2; }
        
        /* New styling for the SVG Syntax Tree */
        .svg-container { overflow-x: auto; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: flex-start; }
        .svg-container svg { max-width: none; } /* Prevents the SVG from squishing */
        
        @media (max-width: 700px) { .charts-grid { grid-template-columns: 1fr; } .full-width-chart { grid-column: span 1; } }
    </style>
</head>
<body>
    <div class="dashboard">
        <a href="analytics.html" style="color: #94a3b8; text-decoration: none; font-size: 0.9em; display: inline-block; margin-bottom: 15px;">View Global Dashboard →</a>
        <h2>Enterprise Sentiment Intelligence</h2>
        <div class="input-group">
            <textarea id="textInput" placeholder="Enter paragraph payload for linguistic and sentiment evaluation..."></textarea>
            <button id="analyzeBtn" onclick="analyzeText()">Execute Analysis</button>
        </div>

        <div id="results-container">
            <div id="profanityWarning" class="profanity-alert"></div>
            <div class="main-sentiment" id="sentimentText"></div>
            
            <div class="charts-grid">
                <!-- Circular/Bar Charts -->
                <div class="chart-box"><canvas id="pieChart"></canvas></div>
                <div class="chart-box"><canvas id="barChart"></canvas></div>
                
                <!-- NEW: Sentiment Flow Line Chart -->
                <div class="chart-box full-width-chart">
                    <h3 style="text-align: center; color: #e2e8f0; font-size: 1.1em; margin-top: 0;">Sentence Progression Flow</h3>
                    <canvas id="lineChart" height="80"></canvas>
                </div>
            </div>

            <!-- NEW: Syntactic Dependency Tree -->
            <div style="margin-top: 30px;">
                <h3 style="text-align: left; color: #e2e8f0; font-size: 1.1em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Syntactic Dependency Parse</h3>
                <div id="syntaxTreeContainer" class="svg-container"></div>
            </div>
            
            <!-- Linguistic Table -->
            <div id="linguistics-container" style="margin-top: 30px; display: none;">
                <h3 style="text-align: left; color: #e2e8f0; font-size: 1.1em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Lexical Data Extraction</h3>
                <div style="overflow-x: auto; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2);">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9em;">
                        <thead><tr style="color: #94a3b8;"><th style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">Token</th><th style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">POS</th><th style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">Lemma</th><th style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">Morphology</th></tr></thead>
                        <tbody id="linguisticsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myPieChart = null;
        let myBarChart = null;
        let myLineChart = null;

        async function analyzeText() {
            const text = document.getElementById('textInput').value;
            const btn = document.getElementById('analyzeBtn');
            const resultsDiv = document.getElementById('results-container');
            const profanityWarning = document.getElementById('profanityWarning');
            
            if(!text.trim()) { alert("Input required."); return; }

            btn.innerText = "Processing..."; btn.style.opacity = "0.7";

            try {
                const response = await fetch('https://nlp-backend-xsoy.onrender.com/analyze', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                
                if (data.has_profanity) { profanityWarning.style.display = 'block'; profanityWarning.innerText = "⚠️ System Flag: Content violates professional communication standards."; } 
                else { profanityWarning.style.display = 'none'; }

                document.getElementById('sentimentText').innerHTML = `Calculated Sentiment: <strong style="color: var(--primary)">${data.sentiment}</strong>`;
                resultsDiv.style.display = 'block';
                
                // Render all 3 charts
                renderCharts(data.scores, data.sentence_flow);
                
                // Render the SVG Tree
                document.getElementById('syntaxTreeContainer').innerHTML = data.dependency_svg;
                
                const lingContainer = document.getElementById('linguistics-container');
                const lingBody = document.getElementById('linguisticsBody');
                lingBody.innerHTML = ''; 
                if (data.linguistics && data.linguistics.length > 0) {
                    data.linguistics.forEach(item => { lingBody.innerHTML += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.02);"><td style="padding: 10px; color: #cbd5e1; font-weight: 500;">${item.word}</td><td style="padding: 10px; color: #64748b;">${item.pos}</td><td style="padding: 10px; color: #94a3b8;">${item.lemma}</td><td style="padding: 10px; color: #475569; font-size: 0.85em;">${item.morph || "N/A"}</td></tr>`; });
                    lingContainer.style.display = 'block';
                } else { lingContainer.style.display = 'none'; }
            } catch (error) {
                alert("Connection failed. Ensure backend is active.");
            } finally { btn.innerText = "Execute Analysis"; btn.style.opacity = "1"; }
        }

        function renderCharts(scores, flowData) {
            const pos = (scores.pos * 100).toFixed(1); const neu = (scores.neu * 100).toFixed(1); const neg = (scores.neg * 100).toFixed(1);
            Chart.defaults.color = '#64748b';

            if (myPieChart) myPieChart.destroy();
            if (myBarChart) myBarChart.destroy();
            if (myLineChart) myLineChart.destroy();

            const ctxPie = document.getElementById('pieChart').getContext('2d');
            myPieChart = new Chart(ctxPie, { type: 'doughnut', data: { labels: ['Positive', 'Neutral', 'Negative'], datasets: [{ data: [pos, neu, neg], backgroundColor: ['#10b981', '#64748b', '#ef4444'], borderWidth: 0 }] }, options: { responsive: true, plugins: { legend: { position: 'bottom' } }, cutout: '70%' } });

            const ctxBar = document.getElementById('barChart').getContext('2d');
            myBarChart = new Chart(ctxBar, { type: 'bar', data: { labels: ['Positive', 'Neutral', 'Negative'], datasets: [{ data: [pos, neu, neg], backgroundColor: ['#10b981', '#64748b', '#ef4444'], borderRadius: 4 }] }, options: { responsive: true, scales: { y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } } });

            // Render the New Line Chart
            if(flowData && flowData.length > 0) {
                const labels = flowData.map(d => `Sentence ${d.sentence_num}`);
                const flowScores = flowData.map(d => d.score);
                const ctxLine = document.getElementById('lineChart').getContext('2d');
                myLineChart = new Chart(ctxLine, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Compound Tone Score (-1 to 1)',
                            data: flowScores,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3,
                            pointBackgroundColor: '#60a5fa'
                        }]
                    },
                    options: { responsive: true, scales: { y: { min: -1, max: 1, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } }, plugins: { legend: { display: true } } }
                });
            }
        }
    </script>
</body>
</html>
